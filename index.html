<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacroDreams — Prototype 01</title>
<style>
  :root{
    --bg:#050609; --text:#eeeae3; --muted:#8b8b91;
    --glow:#b7d9ff; --warm:#d6a77b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}
  .ui{position:fixed;inset:0;pointer-events:none}
  .brand{position:absolute;top:28px;left:32px;letter-spacing:.22em;font-size:11px;color:#c9c7c3;text-transform:uppercase}
  .hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:#686a72;text-transform:uppercase;white-space:nowrap}
  .dna{
    position:absolute;right:7vw;top:50%;transform:translateY(-50%) translateX(18px);
    width:min(310px,34vw);opacity:0;transition:opacity .45s,transform .45s;
  }
  .dna.show{opacity:1;transform:translateY(-50%) translateX(0)}
  .eyebrow{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#777982;margin-bottom:14px}
  .name{font-family:Georgia,serif;font-size:clamp(34px,5vw,62px);font-weight:400;letter-spacing:-.04em;margin:0 0 12px}
  .line{height:1px;background:linear-gradient(90deg,rgba(255,255,255,.28),transparent);margin:16px 0}
  .desc{font-size:13px;line-height:1.65;color:#aaaab0;max-width:280px}
  .swatches{display:flex;gap:7px;margin-top:20px}
  .sw{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}
  .meta{margin-top:18px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#666870}
  .flash{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff;transform:translate(-50%,-50%) scale(.5);opacity:0}
  .flash.on{animation:flash .7s ease-out}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}
</style>
</head>
<body>
<canvas id="globe"></canvas>
<div class="ui">
  <div class="brand">MACRODREAMS</div>
  <div id="dna" class="dna">
    <div class="eyebrow">Visual DNA · <span id="index">01</span></div>
    <h1 id="name" class="name">JEXTER</h1>
    <div class="line"></div>
    <div id="desc" class="desc">Sharp curiosity. Controlled chaos. A personality that turns uncertainty into movement.</div>
    <div id="swatches" class="swatches"></div>
    <div id="meta" class="meta">curiosity / tension / velocity</div>
  </div>
  <div class="hint">drag the world · touch a point</div>
  <div id="flash" class="flash"></div>
</div>

<script>
const canvas=document.getElementById('globe'), ctx=canvas.getContext('2d');
let W,H,DPR,cx,cy,R,rot=0,drag=false,lastX=0,points=[],selected=-1,pulse=0;

const DNAs=[
 {name:"JEXTER",desc:"Sharp curiosity. Controlled chaos. A personality that turns uncertainty into movement.",colors:["#101218","#9eb9d6","#d19a70"],meta:"curiosity / tension / velocity"},
 {name:"ORACLE",desc:"Quiet perception. Pattern before proof. It watches long enough for the hidden shape to appear.",colors:["#0b1114","#9aa89b","#d8c8a5"],meta:"intuition / patience / depth"},
 {name:"MUSE",desc:"Soft magnetism. Sensory, elusive, slightly impossible to pin down.",colors:["#151018","#c59ab9","#e6c6a6"],meta:"beauty / emotion / ambiguity"},
 {name:"ARCHITECT",desc:"Order with imagination. It sees structures where everyone else sees fragments.",colors:["#0c1116","#9aaec3","#c8c1a8"],meta:"structure / clarity / invention"},
 {name:"REBEL",desc:"Instinct over permission. A little friction, deliberately left unresolved.",colors:["#130d0d","#bd7064","#d4aa77"],meta:"friction / instinct / freedom"}
];

function resize(){
 DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
 canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0); cx=W*.43; cy=H*.52; R=Math.min(H*.39,W*.31);
 if(!points.length) makePoints();
}
function makePoints(){
 points=[];
 // spherical point distribution, then gently rotate around the globe
 for(let i=0;i<42;i++){
   const u=Math.random()*2-1, a=Math.random()*Math.PI*2;
   points.push({lat:Math.asin(u),lon:a,seed:Math.random()*10,size:1.2+Math.random()*1.5});
 }
}
function project(p){
 const lon=p.lon+rot, lat=p.lat;
 const x=Math.cos(lat)*Math.sin(lon);
 const y=Math.sin(lat);
 const z=Math.cos(lat)*Math.cos(lon);
 return {x:cx+x*R,y:cy-y*R,z};
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // atmospheric halo
 const g=ctx.createRadialGradient(cx,cy,R*.55,cx,cy,R*1.1);
 g.addColorStop(0,"rgba(55,78,105,.08)");g.addColorStop(.75,"rgba(20,30,44,.035)");g.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.18,0,Math.PI*2);ctx.fill();

 // globe
 const gg=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.05,cx,cy,R);
 gg.addColorStop(0,"rgba(40,48,61,.72)");gg.addColorStop(.48,"rgba(14,18,25,.9)");gg.addColorStop(1,"rgba(3,5,8,.98)");
 ctx.fillStyle=gg;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="rgba(160,185,215,.12)";ctx.lineWidth=1;ctx.stroke();

 // subtle longitude/latitude
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
 ctx.strokeStyle="rgba(160,180,205,.045)";ctx.lineWidth=1;
 for(let i=-3;i<=3;i++){let x=cx+i*R*.27;ctx.beginPath();ctx.ellipse(x,cy,R*.22,R,0,0,Math.PI*2);ctx.stroke()}
 for(let i=-2;i<=2;i++){let y=cy+i*R*.27;ctx.beginPath();ctx.ellipse(cx,y,R,Math.max(2,R*.18),0,0,Math.PI*2);ctx.stroke()}
 ctx.restore();

 // points back-to-front
 points.map((p,i)=>({p,i,q:project(p)})).sort((a,b)=>a.q.z-b.q.z).forEach(({p,i,q})=>{
   if(q.z<-.02)return;
   const selectedNow=i===selected;
   const twinkle=.65+.35*Math.sin(performance.now()/650+p.seed);
   const alpha=(.28+.72*Math.max(0,q.z))*twinkle;
   ctx.beginPath();ctx.arc(q.x,q.y,selectedNow?3.6:p.size,0,Math.PI*2);
   ctx.fillStyle=selectedNow?"rgba(245,232,210,1)":`rgba(192,213,237,${alpha})`;ctx.fill();
   if(selectedNow){
     ctx.beginPath();ctx.arc(q.x,q.y,8+Math.sin(pulse)*3,0,Math.PI*2);
     ctx.strokeStyle="rgba(220,210,190,.28)";ctx.stroke();
   }
 });
 requestAnimationFrame(draw);
}
function hit(x,y){
 let best=-1,bd=18;
 points.forEach((p,i)=>{
   const q=project(p);if(q.z<0)return;
   const d=Math.hypot(q.x-x,q.y-y);
   if(d<bd){bd=d;best=i}
 });
 return best;
}
function select(i){
 if(i<0)return;
 selected=i;pulse=0;
 const d=DNAs[i%DNAs.length];
 document.getElementById("name").textContent=d.name;
 document.getElementById("desc").textContent=d.desc;
 document.getElementById("meta").textContent=d.meta;
 document.getElementById("index").textContent=String(i%DNAs.length+1).padStart(2,"0");
 document.getElementById("swatches").innerHTML=d.colors.map(c=>`<span class="sw" style="background:${c}"></span>`).join("");
 document.getElementById("dna").classList.add("show");
 const f=document.getElementById("flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");
}
canvas.addEventListener("pointerdown",e=>{drag=true;lastX=e.clientX;canvas.classList.add("dragging")});
canvas.addEventListener("pointermove",e=>{
 if(!drag)return;
 rot+=(e.clientX-lastX)/R*.75;lastX=e.clientX;
});
canvas.addEventListener("pointerup",e=>{
 if(!drag)return;drag=false;canvas.classList.remove("dragging");
 if(Math.abs(e.clientX-lastX)<4)select(hit(e.clientX,e.clientY));
});
canvas.addEventListener("pointercancel",()=>{drag=false});
canvas.addEventListener("click",e=>{ if(Math.abs(e.clientX-lastX)<2) select(hit(e.clientX,e.clientY)); });
addEventListener("resize",resize);resize();draw();
setInterval(()=>pulse+=.12,30);
</script>
</body>
</html>
